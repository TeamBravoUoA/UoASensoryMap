<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UoA Sensory Map</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    :root {
      --navy: #141d30;
      --navy-deep: #10192b;
      --navy-card: #19344b;
      --blue-grey: #35586f;
      --green: #93dfb0;
      --line: #dde5ea;
      --text: #172033;
      --muted: #5e6878;
      --surface: #ffffff;
      --page: #f6f8fa;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      color: var(--text);
      background: var(--page);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Header: height reduced significantly from the original (was 145px min-height) */
    header {
      position: relative;
      z-index: 1000;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(130px, 0.4fr);
      align-items: center;
      gap: 1.25rem;
      min-height: 56px;
      padding: 0.4rem 1.25rem;
      color: #fff;
      background: var(--navy);
    }

    h1 {
      margin: 0;
      color: #fff;
      font-family: "Trebuchet MS", Arial, sans-serif;
      font-size: clamp(1.05rem, 1.6vw, 1.4rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: clamp(1rem, 2.4vw, 2.4rem);
    }

    nav > a,
    .nav-item > a {
      position: relative;
      display: flex;
      align-items: center;
      min-width: auto;
      padding: 0.6rem 0;
      color: #fff;
      text-decoration: none;
      font-size: clamp(0.85rem, 1vw, 1.02rem);
      font-weight: 500;
      white-space: nowrap;
    }

    nav > a::after,
    .nav-item > a::after {
      content: "";
      position: absolute;
      right: 0;
      bottom: 0.2rem;
      left: 0;
      height: 2px;
      border-radius: 999px;
      background: var(--green);
      transform: scaleX(0);
      transition: transform 160ms ease;
    }

    nav > a:hover::after,
    nav > a:focus-visible::after,
    .nav-item:hover > a::after,
    .nav-item:focus-within > a::after {
      transform: scaleX(1);
    }

    .nav-item {
      position: relative;
      display: flex;
      align-items: center;
      height: 100%;
    }

    .dropdown {
      position: absolute;
      top: calc(100% + 0.4rem);
      left: 50%;
      width: 250px;
      padding: 0.5rem 0;
      border-top: 3px solid var(--green);
      border-radius: 0 0 8px 8px;
      background: var(--navy-card);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.32);
      z-index: 20;

      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, 10px);
      transition:
        opacity 160ms ease,
        visibility 160ms ease,
        transform 160ms ease;
    }

    .nav-item:hover .dropdown,
    .nav-item:focus-within .dropdown {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .dropdown a {
      display: block;
      min-width: 0;
      padding: 0.65rem 1rem;
      color: #fff;
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 500;
      line-height: 1.3;
      transition:
        color 150ms ease,
        background 150ms ease,
        padding-left 150ms ease;
    }

    .dropdown a:hover,
    .dropdown a:focus-visible {
      padding-left: 1.3rem;
      color: var(--navy);
      background: var(--green);
      outline: none;
    }

    .search-wrap {
      position: relative;
      justify-self: end;
      width: min(185px, 100%);
    }

    .search-wrap::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 0.65rem;
      z-index: 2;
      width: 12px;
      height: 12px;
      border: 2px solid var(--green);
      border-radius: 50%;
      transform: translateY(-60%);
      pointer-events: none;
    }

    .search-wrap::after {
      content: "";
      position: absolute;
      top: 58%;
      left: 1.5rem;
      z-index: 2;
      width: 6px;
      height: 2px;
      border-radius: 999px;
      background: var(--green);
      transform: rotate(45deg);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 34px;
      padding: 0 0.6rem 0 2.1rem;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: var(--blue-grey);
      font: inherit;
      font-size: 0.85rem;
      outline: none;
    }

    #search::placeholder {
      color: #fff;
      opacity: 1;
    }

    #search:focus {
      box-shadow: 0 0 0 3px var(--green);
    }

    .filters button {
      min-width: 120px;
      border: 1px solid #cbd5df;
      border-radius: 8px;
      padding: 0.45rem 0.9rem;
      color: var(--navy);
      background: #fff;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition:
        color 150ms ease,
        background 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }

    .filters button:hover,
    .filters button:focus-visible {
      border-color: var(--green);
      background: var(--green);
      outline: none;
      transform: translateY(-1px);
    }

    .filters .clear-filter {
      min-width: 80px;
      width: auto;
      align-self: center;
      padding: 0.3rem 0.65rem;
      font-size: 0.8rem;
      line-height: 1;
    }

    .filters .clear-filter:hover,
    .filters .clear-filter:focus-visible {
      color: #fff;
      border-color: #c62828;
      background: #c62828;
    }

    main {
  position: relative;
  flex: 1;
  min-height: 0;
}

#map {
  width: 100%;
  height: 100%;
  background: #c7d9c1;
}

.filters {
  position: absolute;
  top: 1rem;
  left: 3rem;
  z-index: 1000;

  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;

}
.space-filter {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
}

.filter-icon {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 1px 4px rgb(0 0 0 / 28%);
}

.filter-icon img {
  width: 21px;
  height: 21px;
}

.study .filter-icon  { background: #1584b8; }
.social .filter-icon { background: #ffb900; }
.quiet .filter-icon  { background: #7135aa; }
.outdoor .filter-icon { background: #2e7d32; }


    @media (max-width: 980px) {
      header {
        grid-template-columns: 1fr;
        gap: 0.5rem;
        min-height: auto;
        padding: 0.6rem 1rem;
      }

      h1 {
        max-width: none;
      }

      nav {
        justify-content: center;
        height: auto;
        flex-wrap: wrap;
      }

      .dropdown {
        top: 100%;
      }

      .search-wrap {
        justify-self: stretch;
        width: 100%;
      }


      main {
        display: flex;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>UoA Sensory Map</h1>

    <nav aria-label="Primary">
      <div class="nav-item">
        <a href="#map">Map</a>

        <div class="dropdown">
          <a href="#map">Old campus</a>
          <a href="#map">Foresterhill campus</a>
          <a href="#map">Hillhead student accommodation</a>
        </div>
      </div>

      <a href={% url 'description' %}>List</a>
      <a href="#legend">Legend</a>
      <a href="#help">Help</a>
    </nav>

    <label class="search-wrap" for="search">
      <input
        type="text"
        id="search"
        placeholder="Search places...."
      />
    </label>
  </header>

  <main>
       
    <div id="map">
    </div>
     <div class="filters">
    <button class="space-filter study">
  <span class="filter-icon">
    <img src="/static/icons/emoji_u1f4da.svg" alt="">
  </span>
  Study space
</button>

<button class="space-filter social">
  <span class="filter-icon">
    <img src="/static/icons/emoji_u1f604.svg" alt="">
  </span>
  Social space
</button>

<button class="space-filter quiet">
  <span class="filter-icon">
    <img src="/static/icons/emoji_u1f507.svg" alt="">
  </span>
  Quiet zone
</button>

<button class="space-filter outdoor">
  <span class="filter-icon">
    <img src="/static/icons/emoji_u1f333.svg" alt="">
  </span>
  Outdoor
</button>

    <button type="button" class="clear-filter" aria-label="Clear filters" title="Clear filters">Clear ✕</button>
  </div>
    
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Centered on the University of Aberdeen Old Aberdeen campus.
    const campusMap = L.map("map", {
      center: [57.1655, -2.0975],
      zoom: 16,
      minZoom: 14,
      maxZoom: 19,
      attributionControl: true
    });

    // Real-world tiles from OpenStreetMap (free, no API key required).
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(campusMap);

    const icons = {
      study: L.icon({
        iconUrl: "/static/icons/emoji_u1f4da.svg",
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      social: L.icon({
        iconUrl: "/static/icons/emoji_u1f604.svg",
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      quiet: L.icon({
        iconUrl: "/static/icons/emoji_u1f507.svg",
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      }),
      outdoor: L.icon({
        iconUrl: "/static/icons/emoji_u1f333.svg",
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      })
    };
   

    function addMarker(place) {
      const icon = icons[place.type] || icons.study;
      L.marker(place.point, { icon })
        .addTo(campusMap)
        .bindPopup("<strong>" + place.name + "</strong>");
    }
        const fallbackPlaces = [
      { name: "Sir Duncan Rice Library", point: [57.165445, -2.105843], type: "study" }, 
      { name: "King's College area", point: [57.163796, -2.101192], type: "social" },
      { name: "Elphinstone Hall", point: [57.164561, -2.100304], type: "social" },
      { name: "Cruickshank Botanic Garden", point: [ 57.167843, -2.104995], type: "outdoor" },
      { name: "Fraser Noble Building", point: [57.165873, -2.104601], type: "study" },
      { name: "Old Aberdeen Quad", point: [57.16398, -2.10121], type: "quiet" }
    ];
    fallbackPlaces.forEach(addMarker);

    // Coordinates are approximate — verify exact pins by right-clicking the
    // real location on openstreetmap.org and copying the lat/lng shown.
   

  </script>
</body>
</html>
